<h2>Reservas</h2>

<a routerLink="/reservas/nuevo" class="btn btn-primary">Nueva Reserva</a>

<table>
  <thead>
    <tr>
      <th>ID</th>
      <th>Pasajero</th>
      <th>Paquete</th>
      <th>Estado</th>
      <th>Personas</th>
      <th>Monto</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let reserva of reservas">
      <td>{{ reserva.idReserva }}</td>
      <td>{{ nombrePasajero(reserva.idPasajero) }}</td>
      <td>{{ nombrePaquete(reserva.idPaquete) }}</td>
      <td>{{ nombreEstado(reserva.idEstadoReserva) }}</td>
      <td>{{ reserva.cantidadPersonas }}</td>
      <td>{{ reserva.montoAcordado | currency:'ARS' }}</td>
    </tr>
  </tbody>
</table>
