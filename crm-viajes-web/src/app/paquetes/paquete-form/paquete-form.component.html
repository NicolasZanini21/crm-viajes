<h2>Nuevo Paquete</h2>

<form [formGroup]="form" (ngSubmit)="guardar()">
  <div>
    <label for="idDestino">Destino</label>
    <select id="idDestino" formControlName="idDestino" class="search-input">
      <option [ngValue]="null" disabled>Seleccioná un destino</option>
      <option *ngFor="let destino of destinos" [ngValue]="destino.idDestino">
        {{ destino.destino }} ({{ destino.pais }})
      </option>
    </select>
    <span *ngIf="form.get('idDestino')?.invalid && form.get('idDestino')?.touched">
      El destino es obligatorio.
    </span>
  </div>

  <div>
    <label for="nombre">Nombre del paquete</label>
    <input id="nombre" type="text" formControlName="nombre" class="search-input" />
    <span *ngIf="form.get('nombre')?.invalid && form.get('nombre')?.touched">
      El nombre es obligatorio.
    </span>
  </div>

  <div>
    <label for="fechaSalida">Fecha de salida</label>
    <input id="fechaSalida" type="date" formControlName="fechaSalida" class="search-input" />
    <span *ngIf="form.get('fechaSalida')?.invalid && form.get('fechaSalida')?.touched">
      La fecha de salida es obligatoria.
    </span>
  </div>

  <div>
    <label for="fechaRegreso">Fecha de regreso</label>
    <input id="fechaRegreso" type="date" formControlName="fechaRegreso" class="search-input" />
    <span *ngIf="form.get('fechaRegreso')?.invalid && form.get('fechaRegreso')?.touched">
      La fecha de regreso es obligatoria.
    </span>
  </div>

  <div>
    <label for="precioBase">Precio base</label>
    <input id="precioBase" type="number" formControlName="precioBase" class="search-input" min="0" step="0.01" />
    <span *ngIf="form.get('precioBase')?.invalid && form.get('precioBase')?.touched">
      El precio tiene que ser un número mayor o igual a 0.
    </span>
  </div>

  <div>
    <label for="descripcion">Descripción</label>
    <textarea id="descripcion" formControlName="descripcion" class="search-input" rows="4"></textarea>
  </div>

  <button type="submit" class="btn btn-primary">Guardar</button>
</form>
